# Serves the repo root the way GitHub Pages does
server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    location = /site.webmanifest {
        default_type application/manifest+json;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml application/manifest+json text/csv;

    location / {
        try_files $uri $uri/ $uri.html =404;
    }
}
